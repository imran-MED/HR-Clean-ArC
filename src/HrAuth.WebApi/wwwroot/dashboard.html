<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HrAuth â€” Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <div class="brand-mark sm">HR</div><span>HrAuth</span>
    </div>
    <nav class="topnav">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="roster.html">Roster</a>
      <a href="upload.html">Upload attendance</a>
      <a href="employees.html">Employees</a>
      <a href="roles.html">Roles</a>
      <a href="reconciliation.html">Reconciliation</a>
      <a href="absent-report.html">Absent report</a>
    </nav>
    <div class="topbar-user">
      <span id="topbar-username" class="muted"></span>
      <button id="logout-btn" class="btn btn-ghost btn-sm">Sign out</button>
    </div>
  </header>

  <main class="dashboard">
    <section class="hero card">
      <div>
        <p class="muted">Welcome back,</p>
        <h2 id="welcome-name" dir="auto">â€”</h2>
        <p id="welcome-sub" class="muted small"></p>
      </div>
      <div id="admin-badge" class="pill pill-admin" hidden>Administrator</div>
    </section>

    <div class="grid">
      <section class="card">
        <h3>Account</h3>
        <dl class="kv">
          <dt>Employee ID</dt><dd id="kv-userid">â€”</dd>
          <dt>Username</dt><dd id="kv-username">â€”</dd>
          <dt>Name</dt><dd id="kv-name" dir="auto">â€”</dd>
          <dt>Position</dt><dd id="kv-position" dir="auto">â€”</dd>
          <dt>Supervisor</dt><dd id="kv-supervisor" dir="auto">â€”</dd>
          <dt>Roles</dt><dd id="kv-roles" class="roles">â€”</dd>
        </dl>
      </section>

      <section class="card">
        <h3>Session</h3>
        <dl class="kv">
          <dt>Token expires</dt><dd id="kv-expires">â€”</dd>
          <dt>Status</dt><dd><span id="kv-status" class="pill">unknown</span></dd>
        </dl>
        <div class="actions">
          <button id="validate-btn" class="btn btn-sm">Validate token</button>
          <button id="refresh-btn" class="btn btn-sm">Refresh token</button>
        </div>
      </section>

      <section class="card span-2">
        <h3>Access token</h3>
        <code id="token-box" class="token">â€”</code>
        <button id="copy-btn" class="btn btn-sm">Copy token</button>
      </section>
    </div>
  </main>

  <p id="toast" class="toast" hidden></p>
  <script src="dashboard.js"></script>
</body>
</html>
